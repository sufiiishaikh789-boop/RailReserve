<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" width="100%" height="100%">
  <defs>
    <linearGradient id="erBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /><stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="headUsers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" /><stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="headTrains" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" /><stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="headBookings" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" /><stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="headFinance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" /><stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="erShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1300" height="950" fill="url(#erBg)" rx="16" />

  <!-- Title & Subtitle -->
  <text x="650" y="45" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">
    ENTITY-RELATIONSHIP (ER) DATA MODEL — 3NF SCHEMA
  </text>
  <text x="650" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    SQLite 3.45 Relational Engine · ACID Transaction Isolation · Foreign Key Integrity · Team 11 (CSE2271)
  </text>

  <!-- ================= ENTITY 1: USERS ================= -->
  <g transform="translate(60, 110)" filter="url(#erShadow)">
    <rect width="250" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headUsers)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">USERS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#e2e8f0">   full_name : VARCHAR(100)</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#67e8f9">UK email : VARCHAR(150)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#67e8f9">UK phone : VARCHAR(20)</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   password_hash : VARCHAR</text>
    <text x="16" y="162" font-family="monospace" font-size="11" fill="#e2e8f0">   role : VARCHAR(20)</text>
    <text x="16" y="180" font-family="monospace" font-size="10" fill="#94a3b8">   created_at : DATETIME</text>
  </g>

  <!-- ================= ENTITY 2: AUDIT_LOGS ================= -->
  <g transform="translate(60, 340)" filter="url(#erShadow)">
    <rect width="250" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headUsers)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">AUDIT_LOGS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK log_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#93c5fd">FK user_id : INTEGER</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   action_type : VARCHAR(50)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   entity_type : VARCHAR(50)</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   entity_id : VARCHAR(50)</text>
    <text x="16" y="162" font-family="monospace" font-size="11" fill="#e2e8f0">   details_json : TEXT</text>
    <text x="16" y="180" font-family="monospace" font-size="10" fill="#94a3b8">   created_at : DATETIME</text>
  </g>

  <!-- Connector: users -> audit_logs -->
  <line x1="185" y1="300" x2="185" y2="340" stroke="#3b82f6" stroke-width="1.8" />
  <circle cx="185" cy="305" r="3" fill="#3b82f6" />
  <polygon points="185,340 181,332 189,332" fill="#3b82f6" />
  <text x="195" y="325" font-family="monospace" font-size="10" fill="#93c5fd">1:N</text>

  <!-- ================= ENTITY 3: TRAINS ================= -->
  <g transform="translate(370, 110)" filter="url(#erShadow)">
    <rect width="250" height="170" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headTrains)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TRAINS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK train_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#67e8f9">UK train_number : VARCHAR(10)</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   train_name : VARCHAR(100)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   train_type : VARCHAR(30)</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   total_coaches : INTEGER</text>
    <text x="16" y="160" font-family="monospace" font-size="10" fill="#94a3b8">   is_active : BOOLEAN</text>
  </g>

  <!-- ================= ENTITY 4: STATIONS ================= -->
  <g transform="translate(680, 110)" filter="url(#erShadow)">
    <rect width="250" height="170" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headTrains)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">STATIONS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK station_code : VARCHAR(10)</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#e2e8f0">   station_name : VARCHAR(100)</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   city : VARCHAR(100)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   state : VARCHAR(100)</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   zone : VARCHAR(20)</text>
    <text x="16" y="160" font-family="monospace" font-size="10" fill="#94a3b8">   total_platforms : INT</text>
  </g>

  <!-- ================= ENTITY 5: ROUTES ================= -->
  <g transform="translate(520, 320)" filter="url(#erShadow)">
    <rect width="260" height="175" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="260" height="32" rx="8" fill="url(#headTrains)" />
    <text x="130" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ROUTES</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK route_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#67e8f9">FK train_id : INTEGER</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#67e8f9">FK station_code : VARCHAR(10)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   stop_sequence : INT</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   distance_km : DECIMAL</text>
    <text x="16" y="162" font-family="monospace" font-size="10" fill="#cbd5e1">   arr_time / dep_time</text>
  </g>

  <!-- Connectors: trains -> routes and stations -> routes -->
  <line x1="495" y1="280" x2="570" y2="320" stroke="#06b6d4" stroke-width="1.8" />
  <line x1="805" y1="280" x2="730" y2="320" stroke="#06b6d4" stroke-width="1.8" />
  <text x="515" y="295" font-family="monospace" font-size="10" fill="#67e8f9">1:N</text>
  <text x="770" y="295" font-family="monospace" font-size="10" fill="#67e8f9">1:N</text>

  <!-- ================= ENTITY 6: TRAIN_SCHEDULES ================= -->
  <g transform="translate(980, 110)" filter="url(#erShadow)">
    <rect width="260" height="175" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="260" height="32" rx="8" fill="url(#headTrains)" />
    <text x="130" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TRAIN_SCHEDULES</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK schedule_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#67e8f9">FK train_id : INTEGER</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   journey_date : DATE</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   departure_time : TIME</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   arrival_time : TIME</text>
    <text x="16" y="162" font-family="monospace" font-size="10" fill="#94a3b8">   is_cancelled : BOOLEAN</text>
  </g>

  <!-- ================= ENTITY 7: SEAT_INVENTORY ================= -->
  <g transform="translate(980, 320)" filter="url(#erShadow)">
    <rect width="260" height="175" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="260" height="32" rx="8" fill="url(#headTrains)" />
    <text x="130" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SEAT_INVENTORY (WAL)</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK inventory_id : INT</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#67e8f9">FK schedule_id : INT</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   class_code : VARCHAR(10)</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#4ade80">   available_seats : INT</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#f87171">   waiting_list_count : INT</text>
    <text x="16" y="162" font-family="monospace" font-size="10" fill="#94a3b8">   total_capacity : INT</text>
  </g>

  <!-- Connector schedules -> seat_inventory -->
  <line x1="1110" y1="285" x2="1110" y2="320" stroke="#06b6d4" stroke-width="1.8" />
  <polygon points="1110,320 1106,312 1114,312" fill="#06b6d4" />
  <text x="1120" y="305" font-family="monospace" font-size="10" fill="#67e8f9">1:N</text>

  <!-- ================= ENTITY 8: BOOKINGS ================= -->
  <g transform="translate(370, 560)" filter="url(#erShadow)">
    <rect width="270" height="215" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="1.5" />
    <rect width="270" height="32" rx="8" fill="url(#headBookings)" />
    <text x="135" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BOOKINGS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK booking_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#fdba74" font-weight="700">UK pnr_number : VARCHAR(20)</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#93c5fd">FK user_id : INTEGER</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#67e8f9">FK schedule_id : INTEGER</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   booking_status : VARCHAR</text>
    <text x="16" y="162" font-family="monospace" font-size="11" fill="#4ade80">   total_fare : DECIMAL(10,2)</text>
    <text x="16" y="184" font-family="monospace" font-size="11" fill="#cbd5e1">   idempotency_key : VARCHAR</text>
    <text x="16" y="204" font-family="monospace" font-size="10" fill="#94a3b8">   created_at : DATETIME</text>
  </g>

  <!-- Connectors: users -> bookings and schedules -> bookings -->
  <line x1="310" y1="205" x2="350" y2="205" stroke="#3b82f6" stroke-width="1.5" />
  <line x1="350" y1="205" x2="350" y2="667" stroke="#3b82f6" stroke-width="1.5" />
  <line x1="350" y1="667" x2="370" y2="667" stroke="#3b82f6" stroke-width="1.5" />
  <polygon points="370,667 362,663 362,671" fill="#3b82f6" />
  <text x="325" y="195" font-family="monospace" font-size="10" fill="#93c5fd">1:N</text>

  <!-- ================= ENTITY 9: PASSENGERS ================= -->
  <g transform="translate(710, 560)" filter="url(#erShadow)">
    <rect width="250" height="215" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headBookings)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PASSENGERS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK passenger_id : INT</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#fdba74">FK booking_id : INT</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   passenger_name : VARCHAR</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#e2e8f0">   age : INTEGER</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   gender : VARCHAR(10)</text>
    <text x="16" y="162" font-family="monospace" font-size="11" fill="#4ade80">   coach_number : VARCHAR</text>
    <text x="16" y="184" font-family="monospace" font-size="11" fill="#4ade80">   seat_number : INT</text>
    <text x="16" y="204" font-family="monospace" font-size="10" fill="#cbd5e1">   berth_pref : VARCHAR</text>
  </g>

  <!-- Connector: bookings -> passengers -->
  <line x1="640" y1="667" x2="710" y2="667" stroke="#ea580c" stroke-width="1.8" />
  <polygon points="710,667 702,663 702,671" fill="#ea580c" />
  <text x="670" y="655" font-family="monospace" font-size="10" fill="#fdba74">1:N</text>

  <!-- ================= ENTITY 10: TRANSACTIONS ================= -->
  <g transform="translate(60, 600)" filter="url(#erShadow)">
    <rect width="250" height="175" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headFinance)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TRANSACTIONS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK txn_id : INTEGER</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#fdba74">FK booking_id : INTEGER</text>
    <text x="16" y="96" font-family="monospace" font-size="11" fill="#e2e8f0">   payment_method : VARCHAR</text>
    <text x="16" y="118" font-family="monospace" font-size="11" fill="#34d399">   amount : DECIMAL(10,2)</text>
    <text x="16" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">   gateway_ref : VARCHAR</text>
    <text x="16" y="162" font-family="monospace" font-size="10" fill="#94a3b8">   status : VARCHAR(20)</text>
  </g>

  <!-- Connector: bookings -> transactions -->
  <line x1="370" y1="687" x2="310" y2="687" stroke="#10b981" stroke-width="1.8" />
  <polygon points="310,687 318,683 318,691" fill="#10b981" />
  <text x="330" y="675" font-family="monospace" font-size="10" fill="#6ee7b7">1:1</text>

  <!-- ================= ENTITY 11: REFUNDS ================= -->
  <g transform="translate(60, 800)" filter="url(#erShadow)">
    <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="url(#headFinance)" />
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REFUNDS</text>
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#facc15" font-weight="700">PK refund_id : INT</text>
    <text x="16" y="72" font-family="monospace" font-size="11" fill="#34d399">FK txn_id : INT</text>
    <text x="16" y="92" font-family="monospace" font-size="11" fill="#f87171">   penalty_deducted : DECIMAL</text>
    <text x="16" y="112" font-family="monospace" font-size="10" fill="#cbd5e1">   net_refund_amount : DECIMAL</text>
  </g>

  <!-- Connector: transactions -> refunds -->
  <line x1="185" y1="775" x2="185" y2="800" stroke="#10b981" stroke-width="1.8" />
  <polygon points="185,800 181,792 189,792" fill="#10b981" />
  <text x="195" y="790" font-family="monospace" font-size="10" fill="#6ee7b7">1:1</text>
</svg>
