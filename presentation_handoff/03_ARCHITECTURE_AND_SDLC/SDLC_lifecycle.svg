  <g transform="translate(80, 500)" filter="url(#boxShadow)">
    <rect width="940" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="180" height="90" rx="10" fill="url(#phaseGrad4)" />
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PHASE 4</text>
    <text x="90" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1fae5" text-anchor="middle">TESTING & QA</text>
    <text x="210" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Automated Verification: 72/72 Tests Passing (100%)</text>
    <text x="210" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Vitest Test Suites · Supertest REST Endpoints · Concurrency Stress & Race-Condition Tests</text>
    <rect x="800" y="28" width="105" height="34" rx="17" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <text x="852" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">72/72 PASS</text>
  </g>

  <!-- Connector 4 -->
  <line x1="550" y1="590" x2="550" y2="615" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="550,620 545,610 555,610" fill="#64748b" />

