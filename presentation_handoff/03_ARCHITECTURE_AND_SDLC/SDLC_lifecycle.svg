  </text>

  <!-- STEP 1: REQUIREMENTS -->
  <g transform="translate(80, 120)" filter="url(#boxShadow)">
    <rect width="940" height="90" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
    <rect width="180" height="90" rx="10" fill="url(#phaseGrad1)" />
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PHASE 1</text>
    <text x="90" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#bfdbfe" text-anchor="middle">REQUIREMENTS</text>
    <text x="210" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">IEEE 830 Specification & Domain Problem Formulation</text>
    <text x="210" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">10 Functional Requirements (FR-01..10) · 7 Non-Functional Requirements (NFR-01..07) · RTM Matrix</text>
    <rect x="800" y="28" width="105" height="34" rx="17" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
    <text x="852" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">GATE 1 PASS</text>
  </g>

  <!-- Connector 1 -->
  <line x1="550" y1="210" x2="550" y2="235" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="550,240 545,230 555,230" fill="#64748b" />

