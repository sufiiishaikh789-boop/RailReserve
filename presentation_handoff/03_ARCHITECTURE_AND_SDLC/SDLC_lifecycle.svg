  <g transform="translate(80, 620)" filter="url(#boxShadow)">
    <rect width="940" height="60" rx="10" fill="#1e293b" stroke="#9333ea" stroke-width="1.5" />
    <rect width="180" height="60" rx="10" fill="url(#phaseGrad5)" />
    <text x="90" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PHASE 5</text>
    <text x="210" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc">CA-3 Demonstration, Audit Trail Logging & Academic Review</text>
    <rect x="800" y="14" width="105" height="32" rx="16" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
    <text x="852" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">REVIEW READY</text>
