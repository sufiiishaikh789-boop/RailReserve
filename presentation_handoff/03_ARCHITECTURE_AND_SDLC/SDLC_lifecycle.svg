      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="phaseGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" /><stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="phaseGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" /><stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="phaseGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" /><stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="phaseGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" /><stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="phaseGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
