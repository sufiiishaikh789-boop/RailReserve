  <g transform="translate(80, 240)" filter="url(#boxShadow)">
    <rect width="940" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="180" height="90" rx="10" fill="url(#phaseGrad2)" />
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PHASE 2</text>
    <text x="90" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cffafe" text-anchor="middle">SYSTEM DESIGN</text>
    <text x="210" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#22d3ee">UML Architecture Modeling & 3NF Database Normalization</text>
    <text x="210" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">StarUML Models (.mdj) · Use Case & Activity Diagrams · Relational Schema (3NF) & WAL Mode</text>
    <rect x="800" y="28" width="105" height="34" rx="17" fill="#083344" stroke="#22d3ee" stroke-width="1" />
    <text x="852" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">GATE 2 PASS</text>
  </g>

