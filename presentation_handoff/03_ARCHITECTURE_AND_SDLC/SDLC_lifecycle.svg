    <text x="90" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffedd5" text-anchor="middle">AGILE SPRINTS</text>
    <text x="210" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fb923c">Iterative Full-Stack Development (4 Core Sprints)</text>
    <text x="210" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Sprint 1: JWT & Auth Gateway | Sprint 2: 3-Category Dashboard & Multi-Class Discovery</text>
    <text x="210" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Sprint 3: Atomic Concurrency Engine (BEGIN IMMEDIATE) | Sprint 4: Payment Webhooks & FIFO WL</text>
    <rect x="800" y="38" width="105" height="34" rx="17" fill="#431407" stroke="#fb923c" stroke-width="1" />
    <text x="852" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#fdba74" text-anchor="middle">GATE 3 PASS</text>
  </g>

